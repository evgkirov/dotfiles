# My own chaotic tmux config, work in progress.

# Common settings

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -as terminal-features ",xterm-ghostty:RGB:extkeys"
set -s extended-keys on
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g set-titles on
set -g set-titles-string 'tmux: #{session_name} — #{pane_current_command}'
# Server may be started from a GUI environment with a minimal PATH; make sure
# run-shell children (navigate.sh) can find Homebrew binaries like tmux/yabai
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"


# Common key bindings

# Worktree management menu. run-shell children get TMUX and no TMUX_PANE, so an
# untargeted tmux command inside the script resolves against whichever session
# tmux considers "best" — not the one the key was pressed in. Pass the pane the
# way the F7-F10 bindings below do; tmux expands #{pane_id} in the right context.
bind g display-menu -T 'worktrees' \
    'Bradley / Worktree / Up' 'u' "run-shell 'TMUX_PANE=#{pane_id} ~/.config/tmux/menu-bradley-worktree.sh up'" \
    'Bradley / Worktree / Down' 'd' "run-shell 'TMUX_PANE=#{pane_id} ~/.config/tmux/menu-bradley-worktree.sh down'" \
    'Bradley / Worktree / Destroy' 'D' "run-shell 'TMUX_PANE=#{pane_id} ~/.config/tmux/menu-bradley-worktree.sh destroy'"

# New panes/windows start in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"


# Window switching (routes Hyper-h/j/k/l from skhd through nvim/tmux/yabai)

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n F7  if-shell "$is_vim" 'send-keys F7'  'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh left"'
bind -n F8  if-shell "$is_vim" 'send-keys F8'  'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh down"'
bind -n F9  if-shell "$is_vim" 'send-keys F9'  'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh up"'
bind -n F10 if-shell "$is_vim" 'send-keys F10' 'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh right"'


# Look and feel

set -g window-style 'fg=color246'
set -g window-active-style 'fg=black'
# set -g status 2
# set -g 'status-format[1]' '#[fill=terminal]'
set-option -g status-position bottom

# set -g pane-border-format '#[align=centre bold]#[reverse] #(~/.config/tmux/app_icons.sh "#{pane_title}")   #{pane_title} #[default]' 
set -g pane-border-format '#[bold]#[reverse] #(~/.config/tmux/app_icons.sh "#{pane_title}")   #{s/✳ //:pane_title} #[default]' 
set -g pane-border-status top

set -g status-bg black
set -g status-fg white
set-window-option -g window-status-current-style bg=green

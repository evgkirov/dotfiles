# My own chaotic tmux config, work in progress.

# Common settings

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB:extkeys"
set -as terminal-features ",xterm-ghostty:RGB:extkeys"
set -s extended-keys on
set -g set-titles on
set -g set-titles-string 'tmux: #{session_name} — #{pane_current_command}'
# Server may be started from a GUI environment with a minimal PATH; make sure
# run-shell children (navigate.sh) can find Homebrew binaries like tmux/yabai
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"


# Common key bindings

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Worktree management menu
bind g display-menu -T 'worktrees' \
    'Bradley / Worktree / Up' 'u' "run-shell \"tmux send-keys -t bradley:main.1 'work-bradley up' Enter 2>/dev/null || tmux send-keys -t '#{pane_id}' 'work-bradley up' Enter\"" \
    'Bradley / Worktree / Down' 'd' "run-shell '~/.config/tmux/menu-bradley-worktree-down.sh'"

# New panes/windows start in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window   -c "#{pane_current_path}"


# Window switching (routes Hyper-h/j/k/l from skhd through nvim/tmux/yabai)

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n F7  if-shell "$is_vim" 'send-keys F7'  'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh left"'
bind -n F8  if-shell "$is_vim" 'send-keys F8'  'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh down"'
bind -n F9  if-shell "$is_vim" 'send-keys F9'  'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh up"'
bind -n F10 if-shell "$is_vim" 'send-keys F10' 'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh right"'


# Look and feel

set -g status-bg "color0"
set -g status-fg "color15"
# set -g status 2
# set -g 'status-format[1]' '#[fill=terminal]'
set-option -g status-position bottom

set -g pane-border-format '#[align=centre bold]#[reverse]#{pane_title}#[default]'
set -g pane-border-status off
set-hook -g 'after-split-window' 'if-shell -F "#{!=:#{window_panes},1}" "set -g pane-border-status top"'
set-hook -g 'after-kill-pane' 'if-shell -F "#{==:#{window_panes},1}" "set -g pane-border-status off"'
set-hook -g 'pane-exited' 'if-shell -F "#{==:#{window_panes},1}" "set -g pane-border-status off"'

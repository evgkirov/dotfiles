# General

set -g mouse on
set -g history-limit 50000
set -g display-time 5000
set -g focus-events on
setw -g monitor-activity on
setw -g monitor-silence 60
setw -g visual-bell on
set -g base-index 1
setw -g pane-base-index 1
# set -g renumber-windows on

# Terminal

set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB:extkeys"
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string 'tmux: #{session_name} — #{pane_current_command}'
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$PATH"

# Copy mode

setw -g mode-keys vi
set -g set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# Key bindings

# New panes/windows start in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Worktree menu. #{pane_id} targets the invoking pane — run-shell children would resolve against the wrong session otherwise
bind g display-menu -T 'worktrees' \
    'Bradley / Worktree / Up' 'u' "run-shell 'TMUX_PANE=#{pane_id} ~/.config/tmux/menu-bradley-worktree.sh up'" \
    'Bradley / Worktree / Down' 'd' "run-shell 'TMUX_PANE=#{pane_id} ~/.config/tmux/menu-bradley-worktree.sh down'" \
    'Bradley / Worktree / Destroy' 'D' "run-shell 'TMUX_PANE=#{pane_id} ~/.config/tmux/menu-bradley-worktree.sh destroy'"

# Navigation

# Hyper-h/j/k/l from skhd routed through nvim/tmux/yabai
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh left"'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh down"'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh up"'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'run-shell "TMUX_PANE=#{pane_id} sh ~/.config/yabai/navigate.sh right"'

# Look and feel

set -g window-style 'fg=color246'
set -g window-active-style 'bg=terminal,fg=terminal'
set -g pane-border-status top
set -g pane-border-format '#[bold]#[reverse] #(~/.config/tmux/app_icons.sh "#{pane_title}")   #{s/✳ //:pane_title} '
set -g status-position bottom
set -g status-style 'bg=color0 fg=color15'
set -g status-left ' 󰆍 #S#[default] '
set -g status-right '󰉋 #{s|$HOME|~|:pane_current_path} '
set -g status-interval 5
set -g window-status-separator ''
set -g @window-status '#{?window_silence_flag,#[fg=lightblue],}#{?window_activity_flag,#[fg=yellow],}#{?window_bell_flag,#[fg=red],}#[bold] #I #[nobold]#{window_name}#{?window_flags, #{window_flags},} '
set -g window-status-format '#{E:@window-status}'
setw -g window-status-current-format '#{E:@window-status}'
setw -g window-status-current-style 'bg=green'
setw -g window-status-activity-style ''
setw -g window-status-bell-style ''

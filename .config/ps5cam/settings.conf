# ps5cam-macos image calibration
#
# Copy this file to ~/.config/ps5cam/settings.conf and edit as needed.
# Changes take effect the next time an app (re)opens the camera — no
# replug required (ps5cam-watchd re-applies these on every stream start).

# Post-processing brightness lift (0-8, firmware default 4)
BRIGHTNESS=7

# Sensor gain (0-8, firmware default 4). Higher = brighter but noisier;
# noise compresses badly on video calls.
GAIN=6

# Manual exposure time in units of 100 microseconds.
#   167 = ~16.7 ms (1/60 s)  -> no motion ghosting, flicker-free on 60 Hz mains
#   250 = 25 ms              -> brighter, slight motion blur
#   333 = ~33 ms             -> ceiling for 30 fps
# The firmware default (1000 = ~100 ms) causes heavy motion ghosting.
EXPOSURE=167

# Anti-flicker for artificial lighting: 1 = 50 Hz mains, 2 = 60 Hz mains.
# Wrong value = dark bands rolling through the image under indoor lights.
POWERLINE=1
